<!doctype html>
<!-- App-icon source: the wordmark's first S (brand/stash-s.svg) in ink #22262f, 62% of the
     tile, centred on the purple→blue stops of the DESIGN.md page-wash gradient drawn
     bottom-left → top-right (the iOS AnimatedGradient direction). brand/build.mjs renders this
     page with headless Chrome at every size the surfaces need; do not edit the PNGs by hand.
     Hash params: #size=<px>  renders the tile at that size (top-left of the window);
                  #rounded    adds the 20% corner radius used where no OS mask applies. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
      /* The tile sits in the centre of a 1024 window so build.mjs can crop it out with a plain
         centred `sips -c` (every target size is an even number, so the offset is exact). */
      body { width: 1024px; height: 1024px; display: grid; place-items: center; }
      .tile {
        width: 1024px;
        height: 1024px;
        background: linear-gradient(45deg, #764ba2, #9d5fd8, #667eea, #4facfe);
        display: grid;
        place-items: center;
      }
      .tile.rounded { border-radius: 20%; }
      .tile svg { color: #22262f; display: block; }
    </style>
  </head>
  <body>
    <div class="tile" id="tile">
      <svg viewBox="0 0 222.77 294.3" fill="currentColor" aria-label="Stash"><path d="M 107.03 0.16 C 109.06 -0.06 110.52 -0.00 112.52 0.04 C 154.84 0.94 183.74 13.55 212.72 43.76 C 200.50 57.49 186.52 75.55 174.49 90.06 C 153.83 68.05 118.82 45.54 86.80 66.68 C 82.82 69.30 79.61 75.05 79.18 79.95 C 78.63 86.33 82.94 93.25 87.98 97.06 C 109.39 111.04 139.78 115.93 163.31 127.13 C 178.13 133.58 191.86 141.46 203.01 153.44 C 232.92 185.55 227.85 240.73 194.80 268.88 C 166.44 293.04 133.47 296.09 97.80 293.57 L 94.70 293.18 C 53.33 287.83 25.16 270.10 0.00 237.43 C 12.72 223.60 30.43 205.58 41.76 191.26 C 56.68 210.33 69.66 224.30 93.65 231.62 C 107.33 235.79 129.45 236.44 142.03 229.15 C 151.39 223.73 154.01 218.11 156.56 208.45 C 151.32 187.04 133.12 181.72 114.26 175.35 C 69.92 160.39 16.53 145.59 13.32 89.76 C 11.80 63.32 20.35 40.04 41.12 22.85 C 60.99 6.71 82.03 1.90 107.03 0.16z"/></svg>
    </div>
    <script>
      const q = new URLSearchParams(location.hash.slice(1));
      const tile = document.getElementById('tile');
      const size = Number(q.get('size')) || 1024;
      tile.style.width = tile.style.height = size + 'px';
      if (q.has('rounded')) tile.classList.add('rounded');
      const svg = tile.querySelector('svg');
      const h = size * 0.62;
      svg.style.height = h + 'px';
      svg.style.width = (h * 222.77 / 294.3) + 'px';
    </script>
  </body>
</html>
