<!doctype html>

     Wallet-style pass view (light mode). "Northline", its mark, the passenger and the flight are
     illustrative. The QR is a decorative grid (real finder/timing/alignment structure, random
     data) drawn by the script at the bottom; it does not decode to anything. -->
<html><head><meta charset="utf-8"><style>

.sb-t{position:absolute;left:0;top:14px;width:132px;text-align:center;font-weight:600;font-size:17px;line-height:20px;letter-spacing:-.4px}
.sb-r{position:absolute;right:28px;top:18px;display:flex;gap:6px;align-items:center}

.done{position:absolute;left:16px;top:65px;color:#007AFF;font-weight:600;font-size:17px;line-height:22px;letter-spacing:-.4px}
.more{position:absolute;right:16px;top:61px;width:30px;height:30px;border-radius:50%;background:rgba(118,118,128,.12);display:grid;place-items:center}

.pass{position:absolute;left:14px;top:108px;width:362px;height:534px;border-radius:14px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 60% at 30% 0%,#1F55AE 0%,rgba(31,85,174,0) 70%),linear-gradient(#1648A0,#0E3A86);
  box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 18px rgba(14,58,134,.18)}
.lab{font-size:10.5px;line-height:13px;font-weight:600;letter-spacing:.5px;color:rgba(214,227,250,.82);text-transform:uppercase}
.val{font-size:18px;line-height:23px;font-weight:400;letter-spacing:-.2px}
.logo{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:20px;line-height:28px;letter-spacing:-.3px}
.hf{position:absolute;top:15px;text-align:right}
.city{position:absolute;top:102px;font-size:13px;line-height:16px;color:rgba(214,227,250,.9);letter-spacing:-.1px}
.code{position:absolute;top:120px;font-weight:300;font-size:56px;line-height:58px;letter-spacing:-.8px}
.plane{position:absolute;left:166px;top:136px}
.f{position:absolute}
.qrbox{position:absolute;left:96px;top:308px;width:170px;height:194px;border-radius:10px;background:#fff;padding:12px 12px 0}
.qrbox p{margin:6px 0 0;text-align:center;color:#3C3C43;font-size:11px;line-height:14px;letter-spacing:.3px}

.stack{position:absolute;left:14px;width:362px;height:60px;border-radius:12px}
.hi{position:absolute;left:128px;top:831px;width:134px;height:5px;border-radius:3px;background:#000}
</style></head><body>

<script>
(function () {
  // Version-3 QR layout (29×29): three finder squares, timing lines, one alignment square, random data.
  const N = 29, m = Array.from({ length: N }, () => Array(N).fill(null));
  const finder = (r, c) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) {
    const y = r + i, x = c + j; if (y < 0 || x < 0 || y >= N || x >= N) continue;
    const ring = Math.max(Math.abs(i - 3), Math.abs(j - 3));
    m[y][x] = ring === 4 ? 0 : ring === 3 ? 1 : ring === 2 ? 0 : 1; } };
  finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
  for (let i = 8; i < N - 8; i++) { m[6][i] = m[i][6] = i % 2 === 0 ? 1 : 0; }
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) { const ring = Math.max(Math.abs(i), Math.abs(j)); m[22 + i][22 + j] = ring === 1 ? 0 : 1; }
  m[N - 8][8] = 1;                                   // the always-dark module
  let s = 9142026;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (m[y][x] !== null) continue;
    const fmt = (y === 8 && (x < 9 || x > N - 9)) || (x === 8 && (y < 9 || y > N - 9));
    m[y][x] = fmt ? (rnd() < .5 ? 1 : 0) : (rnd() < .48 ? 1 : 0);
  }
  let d = '';
  for (let y = 0; y < N; y++) { let x = 0; while (x < N) { if (m[y][x] === 1) { let w = 1; while (x + w < N && m[y][x + w] === 1) w++; d += `M${x} ${y}h${w}v1h-${w}z`; x += w; } else x++; } }
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); p.setAttribute('fill', '#000');
  document.getElementById('qr').appendChild(p);
})();
</script>
</body></html>
