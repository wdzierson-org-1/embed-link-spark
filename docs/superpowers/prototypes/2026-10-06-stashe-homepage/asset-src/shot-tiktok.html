<!doctype html>
<!-- Source for img/shot-tiktok.jpg — an iPhone screenshot of a TikTok-style "For You" feed (dark
     UI) playing a recipe video. @sundaysupper, the counts and the caption are illustrative; the
     avatar is drawn (no faces) and there is no app logo, only generic UI glyphs drawn in SVG.
     Layout and type sizes were measured off real 2024 iPhone screenshots (375×812, rescaled):
     black status-bar strip, video between it and the tab bar, right rail anchored to the bottom.
     The video frame is src/assets/landing/cover-recipe.jpg cover-fit into the vertical frame.
     The share icon's wrapper carries data-share (centre 359, 643 in this 390×844 page). -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#000;position:relative;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;color:#fff}
svg{display:block}

/* status bar (on black: TikTok keeps the video below it) */
.sb{position:absolute;left:0;top:0;width:390px;height:54px}
.sb-t{position:absolute;left:0;top:14px;width:132px;text-align:center;font-weight:600;font-size:17px;line-height:20px;letter-spacing:-.4px}
.sb-r{position:absolute;right:28px;top:18px;display:flex;gap:6px;align-items:center}

/* the video: a landscape photo cover-fit between the status bar and the tab bar */
.vid{position:absolute;left:0;top:54px;width:390px;height:707px;overflow:hidden;background:#2b2520}
.vid img{display:block;width:100%;height:100%;object-fit:cover;object-position:84% 50%;
  filter:brightness(.95) contrast(.95) blur(.45px)}  /* a video frame, not a photo; also keeps the JPEG under budget */
.vid::before,.vid::after{content:"";position:absolute;left:0;right:0}
.vid::before{top:0;height:130px;background:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,0))}
.vid::after{bottom:0;height:360px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.12) 38%,rgba(0,0,0,.5))}

.ov{text-shadow:0 1px 2px rgba(0,0,0,.32)}
.gl{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.28))}

/* top: LIVE, Following / For You, search */
.live{position:absolute;left:15px;top:64px}
.tabs{position:absolute;left:0;right:0;top:65.6px;display:flex;justify-content:center;gap:14px;
  font-size:16px;line-height:20px;font-weight:700;letter-spacing:-.2px;text-shadow:0 1px 2px rgba(0,0,0,.42)}
.tabs span{color:rgba(255,255,255,.74)}
.tabs b{position:relative;font-weight:700}
.tabs b::after{content:"";position:absolute;left:50%;top:28.4px;width:23px;height:2px;margin-left:-11.5px;border-radius:1px;background:#fff;box-shadow:0 0 1px rgba(0,0,0,.2)}
.search{position:absolute;left:350.5px;top:64.7px}

/* the creator's text-tool stickers */
.tt{position:absolute;left:0;right:0;display:flex;justify-content:center}
.tt span{background:#000;color:#fff;font-weight:800;letter-spacing:.1px;white-space:nowrap}
.tt1{top:226px}.tt1 span{font-size:23px;line-height:31px;padding:0 10px;border-radius:7px}
.tt2{top:263px}.tt2 span{font-size:19px;line-height:27px;padding:0 9px;border-radius:6px}

/* right rail: avatar + follow, like, comment, save, share, sound */
.av{position:absolute;left:337px;top:352px;width:44px;height:44px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.92),0 1px 3px rgba(0,0,0,.25)}
.av svg{width:44px;height:44px}
.plus{position:absolute;left:348px;top:385px;width:22px;height:22px;border-radius:50%;background:#FE2C55;display:grid;place-items:center}
.ic{position:absolute;left:339px;width:40px;height:40px;display:grid;place-items:center}
.n{position:absolute;left:319px;width:80px;text-align:center;font-size:12px;line-height:14px;font-weight:700;letter-spacing:-.1px}
.disc{position:absolute;left:337px;top:695px;width:44px;height:44px;border-radius:50%}
.disc .cv{position:absolute;left:9px;top:9px;width:26px;height:26px;border-radius:50%;overflow:hidden;transform:rotate(-24deg)}
.disc .cv svg{width:26px;height:26px}

/* bottom-left: who, caption, sound */
.who{position:absolute;left:12px;top:644px;font-size:17px;line-height:20px;font-weight:700;letter-spacing:-.1px}
.cap{position:absolute;left:12px;top:674px;width:268px;font-size:15px;line-height:18px;letter-spacing:-.1px}
.cap b{font-weight:700}
.snd{position:absolute;left:12px;top:734px;width:236px;height:18px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:15px;line-height:18px;letter-spacing:-.1px}

/* playback progress, on the bottom edge of the video */
.prog{position:absolute;left:0;top:759px;width:390px;height:2px;background:rgba(255,255,255,.24)}
.prog i{display:block;width:38%;height:100%;background:rgba(255,255,255,.92)}

/* tab bar */
.nav{position:absolute;left:0;top:761px;width:390px;height:83px;background:#000}
.nav .ni{position:absolute;top:5px;width:28px;height:24px;display:grid;place-items:center}
.nav .nl{position:absolute;top:31.3px;width:78px;text-align:center;font-size:10.5px;line-height:12px;font-weight:600;color:#BFBFBF;letter-spacing:-.05px}
.nav .nl.on{color:#fff;font-weight:700}
.dot{position:absolute;left:125.9px;top:1.5px;width:7.6px;height:7.6px;border-radius:50%;background:#FE2C55}
.create{position:absolute;left:173.6px;top:8.3px;width:42.8px;height:27.4px}
.create i{position:absolute;top:0;width:35.4px;height:27.4px;border-radius:8px}
.create .c{left:0;background:#25F4EE}.create .r{left:7.4px;background:#FE2C55}.create .w{left:3.7px;background:#fff;display:grid;place-items:center}
