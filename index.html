<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stash — save it fast, find it when you need it</title>
    <meta name="description" content="Capture links, PDFs, screenshots, and voice notes with the thought that made you save them. Stash reads them, describes them, and hands them back when you ask." />
    <meta name="author" content="Stash" />
    
    <!-- The A/4 symbol on charcoal (DESIGN-v2; the iOS app and extension still show the S);
         regenerate every size with `node brand/build.mjs`. ?v= busts browsers' sticky favicon
         caches: bump it whenever the icons change. -->
    <link rel="icon" href="/favicon.ico?v=a4" sizes="48x48">
    <link rel="icon" href="/favicon.svg?v=a4" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png?v=a4" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=a4">
    <link rel="manifest" href="/site.webmanifest?v=a4">
    <meta name="theme-color" content="#FFFFFF">

    <meta property="og:title" content="Stash — save it fast, find it when you need it" />
    <meta property="og:description" content="Capture links, PDFs, screenshots, and voice notes with the thought that made you save them. Stash reads them, describes them, and hands them back when you ask." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gostash.it/" />
    <meta property="og:image" content="https://www.gostash.it/og-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stash: save it fast, find it when you need it." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.gostash.it/og-v2.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
