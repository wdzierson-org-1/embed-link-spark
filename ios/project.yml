name: Stash
options:
  bundleIdPrefix: it.gostash
  deploymentTarget:
    iOS: "17.0"
packages:
  StashKit:
    path: StashKit
# Plan 6 Task 2: single-source app version + release-signing team here so every target (Stash,
# StashShareExtension, StashUITests) inherits identical values — App Store validation requires
# the appex's CFBundleShortVersionString/CFBundleVersion to EQUAL the app's, so these must never
# be set per-target again.
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 4
    DEVELOPMENT_TEAM: 3CH3K9NTT2
targets:
  Stash:
    type: application
    platform: iOS
    sources: [Stash]
    dependencies:
      - package: StashKit
      # Plan 5 Task 5: embeds the built StashShareExtension.appex into Stash.app/PlugIns —
      # `embed: true` is what makes it appear in the system share sheet once Stash is installed.
      - target: StashShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.gostash.stash
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        # Plan 6 (TestFlight) Task 1 + visual overhaul both set this; the designed icon from the
        # visual-overhaul branch (AppIcon-1024.png) is the surviving asset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Plan 5 Task 2: App Group (Outbox/RecordingStore sharing, Task 5+) + keychain access
        # group (shared session, SharedKeychainStorage) — see Stash.entitlements.
        CODE_SIGN_ENTITLEMENTS: Stash/Stash.entitlements
    info:
      path: Stash/Info.plist
      properties:
        CFBundleDisplayName: Stash
        # Plan 6 Task 2: XcodeGen writes literal defaults (1.0/1) for these two keys unless told
        # otherwise — pin them to the single-sourced project settings instead, so the app and
        # appex versions can never drift apart (App Store validation requires equality).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Plan 7 Task 2: registers the bundled PP Neue Montreal TTFs so UIFont(name:) /
        # Font.custom can resolve them — DESIGN.md §Typography, StashType.swift. Flat filenames:
        # Xcode's Copy Bundle Resources phase drops group-referenced files at the bundle root
        # regardless of their on-disk subdirectory (verified against the built .app/.appex).
        # Plan 9 Task 0: PP Editorial New (card title serif, `StashType.editorialTitle()`) is
        # app-target-only — the library grid it serves never renders inside the share extension,
        # unlike the Neue Montreal family above which both targets need.
        UIAppFonts:
          - PPNeueMontreal-Book.ttf
          - PPNeueMontreal-BookItalic.ttf
          - PPNeueMontreal-Medium.ttf
          - PPNeueMontreal-Semibold.ttf
          - PPEditorialNew-Regular.ttf
        NSCameraUsageDescription: "Stash uses the camera to capture photos straight into your stash."
        NSMicrophoneUsageDescription: "Stash uses the microphone for voice notes and dictation."
        NSSpeechRecognitionUsageDescription: "Stash transcribes your speech on-device to fill the composer."
        NSLocationWhenInUseUsageDescription: "Stash tags saves with where you were — only when you turn the pin on."
  StashShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: StashShareExtension
      # Plan 5 Task 7: shares the app target's `LocationCapture.swift` verbatim (compiled as a
      # SEPARATE copy into this target, same file on disk — standard "shared glue file between
      # app + extension" pattern) rather than re-implementing its CLLocationManager state machine
      # a second time. The file has no UIKit/app-only dependencies (CoreLocation + Foundation +
      # Observation + StashKit only — verified by reading it), and re-implementing it here would
      # risk reintroducing the exact continuation-leak/concurrent-resolution bugs its own doc
      # comments describe having already found and fixed once.
      - path: Stash/Capture/LocationCapture.swift
      # Share-sheet polish: the compose card renders in the app's design language (gradient
      # backdrop, wordmark header, circle icon buttons) — same shared-glue-file pattern as
      # LocationCapture.swift above (SwiftUI-only, verified by reading it). The wordmark image +
      # AppIcon it needs live in this target's own Assets.xcassets (an extension's bundle is
      # separate from its host app's, so the app's catalog isn't visible here).
      - path: Stash/Design/StashDesign.swift
      - path: Stash/Design/StashType.swift
      # Plan 7 Task 2: PP Neue Montreal TTFs — an appex has its own bundle (can't read the host
      # app's), so the four font files must physically ship inside StashShareExtension.appex too.
      # Plan 9 Task 0: PP Editorial New excluded — app-target-only face (see project.yml's Stash
      # target UIAppFonts comment); this keeps it out of the appex bundle entirely, not just out
      # of its UIAppFonts list.
      - path: Stash/Design/Fonts
        excludes:
          - "PPEditorialNew-Regular.ttf"
    dependencies:
      - package: StashKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.gostash.stash.share
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        # The share sheet and App Store validation both need the appex to carry its own AppIcon;
        # the designed icon from the visual-overhaul branch is the surviving asset here too.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Plan 5 Task 5: SAME App Group + keychain access group as Stash.entitlements — the
        # extension and the app must see the same Outbox/RecordingStore container and session.
        CODE_SIGN_ENTITLEMENTS: StashShareExtension/StashShareExtension.entitlements
    info:
      path: StashShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Stash
        # Plan 6 Task 2: same fix as the app target — XcodeGen's literal 1.0/1 defaults are the
        # exact latent App Store upload rejection (appex CFBundleShortVersionString must equal
        # the app's); pin both to the single-sourced project settings.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Plan 7 Task 2: an appex has its own bundle (can't read the host app's), so it needs its
        # own UIAppFonts entry + its own copy of the four TTFs (see `sources` above).
        UIAppFonts:
          - PPNeueMontreal-Book.ttf
          - PPNeueMontreal-BookItalic.ttf
          - PPNeueMontreal-Medium.ttf
          - PPNeueMontreal-Semibold.ttf
        # Fix round 1 (Important review finding): the app target declares this; the extension
        # needs its OWN copy (an extension's Info.plist is entirely separate from its host app's,
        # regardless of any TCC-inheritance question the pin-visibility live check settles
        # separately) — cheap insurance, and CLLocationManager would otherwise have no usage string
        # to show if this process ever DID need to prompt.
        NSLocationWhenInUseUsageDescription: "Stash tags saves with where you were — only when you turn the pin on."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 3
              NSExtensionActivationSupportsFileWithMaxCount: 5
  StashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StashUITests]
    dependencies:
      - target: Stash
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stash:
    build:
      targets:
        Stash: all
        StashUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StashUITests
    archive:
      config: Release
