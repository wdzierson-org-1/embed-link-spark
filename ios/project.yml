name: Stash
options:
  bundleIdPrefix: it.gostash
  deploymentTarget:
    iOS: "17.0"
packages:
  StashKit:
    path: StashKit
targets:
  Stash:
    type: application
    platform: iOS
    sources: [Stash]
    dependencies:
      - package: StashKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.gostash.stash
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
    info:
      path: Stash/Info.plist
      properties:
        CFBundleDisplayName: Stash
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Stash uses the camera to capture photos straight into your stash."
        NSMicrophoneUsageDescription: "Stash uses the microphone for voice notes and dictation."
        NSSpeechRecognitionUsageDescription: "Stash transcribes your speech on-device to fill the composer."
  StashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StashUITests]
    dependencies:
      - target: Stash
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stash:
    build:
      targets:
        Stash: all
        StashUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StashUITests
    archive:
      config: Release
