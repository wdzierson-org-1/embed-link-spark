
project_id = "uqqsgmwkvslaomzxptnp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://www.gostash.it"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Hosted project has the same values (set 2026-09-05 via the Management API):
# Supabase is the OAuth 2.1 authorization server for the MCP endpoint.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[functions.twilio-webhook]
verify_jwt = false

[functions.add-note]
verify_jwt = true

[functions.add-file]
verify_jwt = true

[functions.add-url]
verify_jwt = true

[functions.get-public-feed]
verify_jwt = false

[functions.get-comments]
verify_jwt = false

[functions.image-proxy]
verify_jwt = false

[functions.create-trial-subscription]
verify_jwt = true

# Auth is checked in-function (getUser) so failures return our 401 JSON with
# forensics logging; matches the deployed state — do not let a deploy flip
# this on and move auth rejection to the opaque gateway.
[functions.check-subscription]
verify_jwt = false

[functions.quick-pdf-summary]
verify_jwt = true

[functions.summarize-content]
verify_jwt = true

[db]
port = 54322

[storage]
enabled = true
file_size_limit = "50MiB"

# MCP endpoint: auth is checked in-function so unauthenticated requests get
# the RFC 9728 WWW-Authenticate challenge instead of the gateway's opaque 401.
[functions.mcp]
verify_jwt = false

# Cron-invoked (pg_cron → pg_net). Auth is the x-cron-secret header checked
# in-function; there is no user JWT on this path.
[functions.reminder-digest]
verify_jwt = false

# Temporary admin dashboard. The gateway verifies the JWT; the function then
# requires an admin_users row (docs/superpowers/specs/2026-09-08-admin-dashboard-design.md).
[functions.admin-stats]
verify_jwt = true
