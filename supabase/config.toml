
project_id = "uqqsgmwkvslaomzxptnp"

[functions.quality-model]
verify_jwt = false

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://www.gostash.it"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Hosted project has the same values (set 2026-09-05 via the Management API):
# Supabase is the OAuth 2.1 authorization server for the MCP endpoint.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

# Hosted project has the same values (set 2026-10-11 via the Management API, plan
# docs/superpowers/plans/2026-10-11-google-apple-sign-in-web.md Task 3). Id-token sign-in only:
# the clients get the token from Google/Apple themselves, so Supabase auth holds no provider
# client secret (the Apple .p8 lives only in edge-function secrets, spec §5.4).
[auth.external.google]
enabled = true
client_id = "772942709290-2j03nu08hnumh6jfe2h0j6jkh9bnrbta.apps.googleusercontent.com,772942709290-ha25d35f942l5blept0aiv30aculahsn.apps.googleusercontent.com"
secret = ""
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "it.gostash.web,it.gostash.stash"
secret = ""

[functions.twilio-webhook]
verify_jwt = false

[functions.add-note]
verify_jwt = true

[functions.add-file]
verify_jwt = true

[functions.add-url]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Apple authorization code → refresh token (plan 2026-10-11-google-apple-sign-in-web Task 13);
# GET = revocation readiness (2026-10-12).
[functions.apple-token-exchange]
verify_jwt = true

# Cron retry of Sign in with Apple revocations delete-account could not finish (x-cron-secret).
[functions.apple-revocation-sweep]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.get-public-feed]
verify_jwt = false

[functions.get-comments]
verify_jwt = false

[functions.image-proxy]
verify_jwt = false

[functions.create-trial-subscription]
verify_jwt = true

# Auth is checked in-function (getUser) so failures return our 401 JSON with
# forensics logging; matches the deployed state — do not let a deploy flip
# this on and move auth rejection to the opaque gateway.
[functions.check-subscription]
verify_jwt = false

[functions.quick-pdf-summary]
verify_jwt = true

[functions.summarize-content]
verify_jwt = true

[db]
port = 54322

[storage]
enabled = true
# Local stack only; production's project limit (also 100 MiB since 2026-10-07)
# is set in the dashboard / Management API, not by this file.
file_size_limit = "100MiB"

# MCP endpoint: auth is checked in-function so unauthenticated requests get
# the RFC 9728 WWW-Authenticate challenge instead of the gateway's opaque 401.
[functions.mcp]
verify_jwt = false

# Cron-invoked (pg_cron → pg_net). Auth is the x-cron-secret header checked
# in-function; there is no user JWT on this path.
[functions.reminder-digest]
verify_jwt = false

# Temporary admin dashboard. The gateway verifies the JWT; the function then
# requires an admin_users row (docs/superpowers/specs/2026-09-08-admin-dashboard-design.md).
[functions.admin-stats]
verify_jwt = true

# Signed-link opt-out from the reminder digest; the token is the auth.
[functions.reminder-email-prefs]
verify_jwt = false

# Transcription job (spec 2026-09-09). Auth is in-function: x-cron-secret
# (sweep + continuation), the service role (add-file), or the item owner's JWT —
# pg_cron sends no JWT, so the gateway check must stay off.
[functions.transcribe-audio]
verify_jwt = false

# Shared cron secret is verified inside the bounded enrichment worker.
[functions.enrichment-maintenance]
verify_jwt = false

# Public homepage "try it" demo: anonymous by design. Admission (per-IP and global caps)
# is enforced in-function via homepage_enrich_admit; nothing is stored.
[functions.homepage-enrich]
verify_jwt = false

# Private machine endpoints verify their own scoped worker / cron secrets.
[functions.quality-worker]
verify_jwt = false

[functions.quality-dispatch]
verify_jwt = false

# Source-grounded structured attributes; private cron/service authentication.
[functions.object-intelligence-worker]
verify_jwt = false

# User-owned interaction reads and drafts verify the session JWT in-function.
[functions.object-interactions]
verify_jwt = false
